version: 2

# Fivetran lands the HRIS and ATS tables from one Postgres schema, so both sources point at the same
# BigQuery dataset. Freshness is measured on _fivetran_synced, which only moves when a row changes, so
# each table's threshold follows how often it really changes.
#
# Every table carries its schema contract (docs/data-contract-hris.md) twice: as a breaking check that
# fails the build when a column the models read goes missing or changes type, and as an additive check
# that only warns when the source grows a new column.
sources:
  - name: hris
    description: HR system of record (employees, job history, positions, departments, exits), synced by Fivetran.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'raw_hris') }}"
    config:
      loaded_at_field: _fivetran_synced
    tables:
      - name: employees
        identifier: hris_employees
        description: Current state of each person's employment record, updated in place.
        data_tests:
          - schema_contract:
              arguments:
                column_types: &employees_contract
                  employee_id: string
                  first_name: string
                  last_name: string
                  email: string
                  hire_date: date
                  termination_date: date
                  status: string
                  employment_type: string
                  updated_at: timestamp
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *employees_contract, change: additive}
              config: {severity: warn}
      - name: job_history
        identifier: hris_job_history
        description: Effective-dated job records; one row per change in a person's job.
        config:
          freshness:
            warn_after: {count: 10, period: day}
            error_after: {count: 14, period: day}
        data_tests:
          - schema_contract:
              arguments:
                column_types: &job_history_contract
                  job_history_id: string
                  employee_id: string
                  effective_from: date
                  effective_to: date
                  position_id: string
                  department_id: string
                  manager_id: string
                  location: string
                  job_level: string
                  salary_local: numeric
                  currency: string
                  change_reason: string
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *job_history_contract, change: additive}
              config: {severity: warn}
          - dbt_utils.expression_is_true:
              arguments:
                expression: "effective_to >= effective_from"
              config:
                where: "not _fivetran_deleted"
          # If the source starts sending job_level as a bare number, Fivetran keeps the landed column as
          # text (it only widens types), so the contract still passes; this check notices the new format.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "regexp_contains(cast(job_level as string), r'^L[1-7]$')"
              config:
                where: "not _fivetran_deleted"
                severity: warn
      - name: positions
        identifier: hris_positions
        description: Seats in the org chart, filled or open; a promotion regrades the seat in place.
        data_tests:
          - schema_contract:
              arguments:
                column_types: &positions_contract
                  position_id: string
                  job_title: string
                  department_id: string
                  job_level: string
                  is_filled: bool
                  created_at: timestamp
                  closed_date: date
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *positions_contract, change: additive}
              config: {severity: warn}
      - name: departments
        identifier: hris_departments
        description: Departments in a two-level org (teams sit under a parent department).
        data_tests:
          - schema_contract:
              arguments:
                column_types: &departments_contract
                  department_id: string
                  department_name: string
                  parent_department_id: string
                  cost_center: string
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *departments_contract, change: additive}
              config: {severity: warn}
      - name: terminations
        identifier: hris_terminations
        description: One row per exit event.
        data_tests:
          - schema_contract:
              arguments:
                column_types: &terminations_contract
                  termination_id: string
                  employee_id: string
                  termination_date: date
                  termination_type: string
                  reason_code: string
                  regretted_flag: bool
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *terminations_contract, change: additive}
              config: {severity: warn}
        columns:
          - name: employee_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('hris', 'employees')
                    field: employee_id
                  config:
                    where: "not _fivetran_deleted"

  - name: ats
    description: Applicant tracking system (requisitions, applications, stage history), synced by Fivetran.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'raw_hris') }}"
    config:
      loaded_at_field: _fivetran_synced
    tables:
      - name: requisitions
        identifier: ats_requisitions
        description: Approved openings, each for one position.
        data_tests:
          - schema_contract:
              arguments:
                column_types: &requisitions_contract
                  req_id: string
                  position_id: string
                  department_id: string
                  hiring_manager_id: string
                  opened_date: date
                  closed_date: date
                  status: string
                  employment_type: string
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *requisitions_contract, change: additive}
              config: {severity: warn}
      - name: applications
        identifier: ats_applications
        description: One candidate applying to one requisition.
        config:
          freshness:
            warn_after: {count: 28, period: hour}
            error_after: {count: 34, period: hour}
        data_tests:
          - schema_contract:
              arguments:
                column_types: &applications_contract
                  application_id: string
                  req_id: string
                  candidate_id: string
                  source: string
                  applied_date: date
                  current_stage: string
                  stage_updated_at: timestamp
                  hired_employee_id: string
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *applications_contract, change: additive}
              config: {severity: warn}
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [req_id, candidate_id]
              config:
                where: "not _fivetran_deleted"
      - name: application_stages
        identifier: ats_application_stages
        description: Every stage an application entered, with its timestamp.
        data_tests:
          - schema_contract:
              arguments:
                column_types: &application_stages_contract
                  stage_event_id: string
                  application_id: string
                  stage: string
                  entered_at: timestamp
                  _fivetran_deleted: bool
                  _fivetran_synced: timestamp
                  _loaded_at: timestamp
          - schema_contract:
              arguments: {column_types: *application_stages_contract, change: additive}
              config: {severity: warn}
